name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint and screenshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Use JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Validates the wrapper checksum and caches Gradle state between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint
        run: >-
          ./gradlew
          assembleDebug
          testDebugUnitTest
          lintDebug
          :app:recordRoborazziDebug
          --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: finto-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: finto-screenshots
          path: android/app/build/outputs/roborazzi/*.png

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
