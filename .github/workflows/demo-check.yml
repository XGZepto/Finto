name: Check demo

# Vercel deploys every push to `main` to the `finto` project's `demo` custom
# environment, which serves demo.finto.zepto.page. This checks that the public
# demo login works and reaches the seeded demo ledger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the public demo
    runs-on: ubuntu-latest
    environment: Demo
    steps:
      - name: Verify demo login and data
        shell: bash
        env:
          DEMO_PASSWORD: ${{ secrets.FINTO_DEMO_PASSWORD }}
        run: |
          demo_url="https://demo.finto.zepto.page"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$demo_url/api/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Demo health check did not become ready."
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error \
            --cookie-jar "$RUNNER_TEMP/finto-demo.cookies" \
            --header 'Content-Type: application/json' \
            --data "$(jq --null-input --arg password "$DEMO_PASSWORD" \
              '{identifier: "demo", password: $password}')" \
            "$demo_url/api/auth/login" \
            | jq --exit-status '.ok and (.user.username == "demo")' >/dev/null

          curl --fail --silent --show-error \
            --cookie "$RUNNER_TEMP/finto-demo.cookies" \
            "$demo_url/api/accounts" \
            | jq --exit-status '.accounts | length > 0' >/dev/null
