# Synthetic configuration example. Copy to accounts.yaml, which is gitignored.
# IDs are stable slugs and should not be renamed after transactions are imported.

institutions:
  - id: example_bank
    display_name: Example Bank
    country: HK
    timezone: Asia/Hong_Kong
  - id: example_card
    display_name: Example Card Issuer
    country: US
    timezone: America/New_York

parties:
  - id: self
    display_name: Me
    kind: self
    aliases: ["YOUR NAME", "YOUR BANK TRANSFER NAME"]
  - id: example_friend
    display_name: Example Friend
    kind: person
    aliases: ["EXAMPLE FRIEND"]

accounts:
  - id: example_hkd_savings
    institution_id: example_bank
    display_name: Example HKD Savings
    account_type: savings
    primary_currency: HKD
    settlement_currencies: [HKD]
    balance_group: example_bank_personal
    masked_number: "****1234"
    aliases: ["EXAMPLE BANK", "HKD SAVINGS"]

  - id: example_usd_savings
    institution_id: example_bank
    display_name: Example USD Savings
    account_type: savings
    primary_currency: USD
    settlement_currencies: [USD]
    balance_group: example_bank_personal
    masked_number: "****5678"
    aliases: ["USD SAVINGS"]

  - id: example_credit_card
    institution_id: example_card
    display_name: Example Credit Card
    account_type: credit_card
    primary_currency: USD
    settlement_currencies: [USD]
    masked_number: "****9012"
    aliases: ["EXAMPLE CARD", "CARD PAYMENT"]

cards:
  - id: example_credit_card_primary
    account_id: example_credit_card
    cardholder_name: YOUR NAME
    last4: "9012"
    is_supplementary: false

  - id: example_credit_card_supplementary
    account_id: example_credit_card
    cardholder_name: EXAMPLE FAMILY MEMBER
    last4: "3456"
    is_supplementary: true

rules:
  - id: example_grocery_rule
    priority: 100
    match_field: description_norm
    match_type: contains
    pattern: EXAMPLE SUPERMARKET
    set_kind: purchase
    set_category: groceries
    set_subcategory: supermarket
