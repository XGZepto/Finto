# Copy to accounts.yaml (gitignored) and fill in real names.
# Account ids are stable slugs — once chosen, don't rename them.
#
# parties.self aliases are how the transfer matcher recognises "FPS to myself"
# across institutions that spell your name differently. parties.person aliases
# mark P2P counterparties so those movements are NOT auto-netted as
# self-transfers. account.aliases are tokens that appear on the *other* leg
# ("MOX", "AMEX") so HSBC→Mox can link even among several same-day equal amounts.

institutions:
  - id: amex_us
    display_name: American Express (US)
    country: US
    timezone: America/New_York
  - id: amex_hk
    display_name: American Express (HK)
    country: HK
  - id: hsbc_hk
    display_name: HSBC Hong Kong
    country: HK
  - id: wise
    display_name: Wise
    country: HK
  - id: mox
    display_name: Mox Bank
    country: HK
  - id: chase_us
    display_name: JPMorgan Chase (US)
    country: US
    timezone: America/New_York

parties:
  # Every spelling of your own name that appears on statements / FPS.
  - id: self
    display_name: Me
    kind: self
    aliases:
      - YIXIANG ZHOU
      - ZEPTO ZHOU YIXIANG
      - ZHOU YIXIANG
  # People you send money to. Their transfers are real spend — labelled, not netted.
  # - id: person_example
  #   display_name: Friend Name
  #   kind: person
  #   aliases: ["FRIEND NAME", "FPS FRIEND"]

