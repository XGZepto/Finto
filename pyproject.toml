[project]
name = "finto"
version = "0.1.0"
description = "Personal finance ledger: multi-institution ingest, dedup, and transfer linking"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
finto = "fin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fin", "fin.parsers", "fin.llm"]

[tool.setuptools.package-data]
fin = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
