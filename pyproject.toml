[project]
name = "finto"
version = "0.4.4"
description = "Self-hosted multi-user finance ledger with statement ingestion and account ACLs"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.120"]
pdf = ["pdfplumber>=0.11", "pypdf>=4.0"]
xlsx = ["openpyxl>=3.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7.0", "ruff>=0.1", "pdfplumber>=0.11", "pypdf>=4.0", "openpyxl>=3.1",
       "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
finto = "fin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fin", "fin.parsers", "fin.llm", "fin.api", "fin.api.routers", "fin.pdf"]

[tool.setuptools.package-data]
fin = ["schema.sql", "pdf/templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reads the real statement archive; skipped unless it is present",
]

[tool.ruff]
line-length = 100
